version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
  settings:
    errcheck:
      check-blank: true
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    paths:
      - dist
      - scripts
      - vendor
    rules:
      # Exclude shadow checking warnings
      - text: "shadow: declaration of \"err\" shadows"
        linters:
          - govet
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - lll

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    paths:
      - dist
      - scripts
      - vendor

output:
  formats:
    text:
      path: stdout
  show-stats: true
