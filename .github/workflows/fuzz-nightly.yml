name: Fuzz Nightly

# Longer differential + local fuzz campaign (docs/audit/differential-fuzzing.md
# Phase 3). Split into two jobs so each fits its timeout: fuzz-local needs no
# oracle; fuzz-differential installs the pinned `stellar` CLI release binary
# and runs the corpus replay + oracle-diff targets. The oracle install is
# intentionally fatal — the differential job exists to run the oracle, and a
# soft-failed install previously produced nights of silent zero-coverage runs.
# Divergence artifacts (fuzzer-written testdata/fuzz/) are uploaded for triage.

on:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: 28.0.0

jobs:
  fuzz-local:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz pkg/soroban local targets
        run: |
          scripts/fuzz_target.sh pkg ./soroban/ FuzzCompareScVal 10m
          scripts/fuzz_target.sh pkg ./soroban/ FuzzScMapSortDeterminism 5m
          scripts/fuzz_target.sh pkg ./soroban/ FuzzToScVal 5m

      - name: Fuzz pkg/iso20022 + pkg/x402
        run: |
          scripts/fuzz_target.sh pkg ./iso20022/ FuzzParseDocuments 5m
          scripts/fuzz_target.sh pkg ./iso20022/ FuzzMarshalUnmarshalRoundTrip 5m
          scripts/fuzz_target.sh pkg ./x402/ FuzzDecodeHeaders 5m
          scripts/fuzz_target.sh pkg ./x402/ FuzzParseAtomicAmount 5m

      - name: Fuzz internal/mcp + internal/config
        run: |
          scripts/fuzz_target.sh . ./internal/mcp/ FuzzCallTool 5m
          scripts/fuzz_target.sh . ./internal/mcp/ FuzzValidateAndCollect 5m
          scripts/fuzz_target.sh . ./internal/config/ FuzzConfigLoad 3m
          scripts/fuzz_target.sh . ./internal/config/ FuzzLoadState 3m

      - name: Upload divergence artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-local-${{ github.run_id }}
          path: |
            pkg/**/testdata/fuzz/
            internal/**/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30

  fuzz-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install stellar CLI oracle
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin" stellar

      - name: Oracle version
        run: stellar version

      - name: Tier-1 corpus replay
        run: cd pkg && go test -run TestCorpusDifferential -v ./soroban/

      - name: Fuzz differential targets (10m each)
        run: |
          scripts/fuzz_target.sh pkg ./soroban/ FuzzScValEncodeDifferential 10m
          scripts/fuzz_target.sh pkg ./soroban/ FuzzScValDecodeDifferential 10m
          scripts/fuzz_target.sh pkg ./soroban/ FuzzStrkeyDifferential 5m
          scripts/fuzz_target.sh pkg ./soroban/ FuzzTxEnvelopeDifferential 5m

      - name: Upload divergence artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-differential-${{ github.run_id }}
          path: |
            pkg/**/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
