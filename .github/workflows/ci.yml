name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Stage ISO 20022 XSDs
        run: make xsd

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Build (extras)
        run: go build -tags extras ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  # Bounded local fuzz smoke on every PR/push — oracle-free targets only
  # (differential targets self-skip without the stellar CLI; the nightly
  # workflow runs them with the oracle installed).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz seed corpus (both modules)
        run: |
          go test -run 'Fuzz' ./...
          cd pkg && go test -run 'Fuzz' ./...

      - name: Fuzz pkg/soroban local targets
        run: |
          scripts/fuzz_target.sh pkg ./soroban/ FuzzCompareScVal 60s
          scripts/fuzz_target.sh pkg ./soroban/ FuzzScMapSortDeterminism 30s
          scripts/fuzz_target.sh pkg ./soroban/ FuzzToScVal 30s

      - name: Fuzz pkg/iso20022 + pkg/x402
        run: |
          scripts/fuzz_target.sh pkg ./iso20022/ FuzzParseDocuments 30s
          scripts/fuzz_target.sh pkg ./x402/ FuzzDecodeHeaders 30s

      - name: Fuzz internal/mcp + internal/config
        run: |
          scripts/fuzz_target.sh . ./internal/mcp/ FuzzCallTool 30s
          scripts/fuzz_target.sh . ./internal/config/ FuzzConfigLoad 20s
