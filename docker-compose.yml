services:
  webauthn:
    build:
      context: .
      dockerfile: Dockerfile.webauthn
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    networks:
      - stellar-go-cli
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "3000:3000"
    environment:
      - TRANSPORT=sse
      - PORT=3000
      - LOG_LEVEL=info
      - NETWORK=stellar-testnet
    networks:
      - stellar-go-cli
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  stellar-go-cli:
    driver: bridge
